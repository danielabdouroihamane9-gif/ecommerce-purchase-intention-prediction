name: Docker build and smoke test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade pip && pip install uv

      - name: Sync dependencies and train the model
        run: uv sync --python 3.12 --frozen && uv run python train.py

      - name: Build the Docker image
        run: docker build -t ecommerce-purchase-intention .

      - name: Smoke test the container
        run: |
          docker run -d --rm -p 8000:8000 --name ecommerce-purchase-intention-api ecommerce-purchase-intention
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{
              "Administrative": 0,
              "Administrative_Duration": 0.0,
              "Informational": 0,
              "Informational_Duration": 0.0,
              "ProductRelated": 2,
              "ProductRelated_Duration": 64.0,
              "BounceRates": 0.0,
              "ExitRates": 0.1,
              "SpecialDay": 0.0,
              "Month": "Feb",
              "OperatingSystems": 2,
              "Browser": 2,
              "Region": 1,
              "TrafficType": 2,
              "VisitorType": "Returning_Visitor",
              "Weekend": false
            }'
          docker stop ecommerce-purchase-intention-api
